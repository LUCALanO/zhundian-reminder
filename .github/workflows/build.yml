name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Switch to official sources for GitHub runners (China mirrors time out on GH)
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|^networkTimeout=.*|networkTimeout=60000|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|maven.aliyun.com/repository/google|dl.google.com/dl/android/maven2|' settings.gradle.kts
          sed -i 's|maven.aliyun.com/repository/public|repo.maven.apache.org/maven2|' settings.gradle.kts
          sed -i 's|maven.aliyun.com/repository/central|repo.maven.apache.org/maven2|' settings.gradle.kts
          sed -i 's|maven.aliyun.com/repository/gradle-plugin|plugins.gradle.org/m2|' settings.gradle.kts
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          grep -cE "dl.google.com|repo.maven.apache.org|plugins.gradle.org" settings.gradle.kts

      - name: Unit tests + build debug APK
        # 只构建 debug APK 并跑单测，无需发布签名；
        # 发布签名通过 KEYSTORE_* 环境变量从 secrets 注入（后续发布 Release 时启用）
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
